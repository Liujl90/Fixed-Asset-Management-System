spring:
  application:
    name: fixed-asset-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  quartz:
    job-store-type: memory
    auto-startup: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:fixed-asset-demo-secret-key-change-me-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cache:
    provider: ${CACHE_PROVIDER:memory}
  quartz:
    depreciation-cron: ${DEPRECIATION_CRON:0 0 2 1 * ?}
    maintenance-cron: ${MAINTENANCE_CRON:0 0 8 * * ?}
